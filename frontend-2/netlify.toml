# Netlify config for the BILLSzuka viewer (frontend-2).
# Point the site's Base directory at frontend-2/ in the Netlify UI
# (or move this file to the repo root and set base = "frontend-2").

[build]
  base = "."
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
