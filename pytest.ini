[pytest]
# Minimal config — see tests/conftest.py for sys.path setup.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    network: tests that make live API calls (KRS, VIES, CEIDG, ARES, etc.)
filterwarnings =
    error
    # The verify_*_row functions are deliberately permissive with input dicts;
    # don't escalate DeprecationWarnings to errors for now.
    ignore::DeprecationWarning
    # starlette<0.40 imports the legacy 'multipart' package (not
    # python-multipart). That package emits PendingDeprecationWarning
    # at import time ("Please use 'import python_multipart' instead.").
    # The warning is unrelated to our tests; ignore it.
    ignore::PendingDeprecationWarning
