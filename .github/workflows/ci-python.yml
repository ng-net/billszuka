name: CI

# Workflow recreated 2026-08-21 to force a fresh workflow ID.
# Old runs were stuck referencing workflow ID 332616408 (which no
# longer exists in the repo's workflow list) and failing with
# startup_failure / no jobs. See DZIENNIK 2026-08-21.

on:
  push:
    branches: [main, master, develop, "feature/**"]
  pull_request:
    branches: [main, master, develop, "feature/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The tools/ scripts use only stdlib; pytest + FastAPI/httpx
          # (for API server tests) are the only external deps.
          pip install -r requirements-ci.txt

      - name: Run pytest
        run: |
          pytest tests/ -v

      - name: Smoke-test the 11-level harness
        run: |
          # Verify test_11_levels.py still reports its 3-state outcome
          # correctly (most levels will be SKIP without API keys; that's
          # expected and not a failure).
          python3 tools/test_11_levels.py 2>&1 | tail -10

      - name: Smoke-test master.csv regen
        run: |
          python3 -c "
          import sys; sys.path.insert(0, 'tools')
          from verify_run import regenerate_master
          ok, count = regenerate_master()
          assert ok, 'regenerate_master() must succeed'
          assert count > 0, 'master.csv must have data rows'
          print(f'master regen OK: {count} rows')
          "

      - name: Validate column data quality
        run: |
          # Runs tools/validate_columns.py — fails the build if there are
          # critical column issues (row-arity, missing required fields,
          # bad NIPs, enum violations). Warnings don't block.
          #
          # Use --exit-zero to collect the report without failing on first
          # push, then assert the right threshold manually.
          python3 tools/validate_columns.py --exit-zero
          python3 -c "
          import json, re, subprocess, sys
          # Parse the most recent report
          from pathlib import Path
          reports = sorted(Path('data/validation-reports').glob('columns-*.md'))
          assert reports, 'no validation report found'
          text = reports[-1].read_text(encoding='utf-8')
          m = re.search(r'Critical issues\*\*:\s*(\d+)\s*\n\s*-\s*\*\*Warnings\*\*:\s*(\d+)', text)
          assert m, 'could not parse report'
          critical, warning = int(m.group(1)), int(m.group(2))
          print(f'Validation: {critical} critical, {warning} warning')
          # Threshold: 0 critical for synthetic data; 148 is the realistic floor for
          # real B2B data (multi-value phones, NIP format variations, free-text enums).
          # Every one of the 148 remaining criticals is a real data quality issue
          # requiring human research — not a schema or code error.
          # Bump this threshold only with explicit Marceli sign-off.
          assert critical < 200, f'CRITICAL column issues found: {critical} (floor ~148, threshold < 200)'
          "

      - name: Smoke-test the API server
        run: |
          # Start the API server, hit /api/datasets, kill it. This catches
          # import-time errors and confirms the FastAPI app boots.
          python3 tools/api_server.py --port 18765 &
          SERVER_PID=$!
          sleep 3
          curl -sf http://127.0.0.1:18765/api/datasets | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          assert 'datasets' in data
          assert data['count'] > 0, 'no datasets found'
          print(f'API OK: {data[\"count\"]} datasets')
          "
          kill $SERVER_PID 2>/dev/null || true

  js-test:
    name: JS tests (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-2/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend-2

      - name: Run JS tests
        # Bump V8 old-space to 4 GB. The default ~2 GB on the GitHub
        # runner OOMs while loading framer-motion + radix-ui + happy-dom
        # in vite-node (see OOM in run 33260055027). 4 GB is enough for
        # the current 21 component tests without slowing them down.
        run: NODE_OPTIONS=--max-old-space-size=4096 npm test
        working-directory: frontend-2
