name: CI

# Workflow recreated 2026-08-21 to force a fresh workflow ID.
# Old runs were stuck referencing workflow ID 332616408 (which no
# longer exists in the repo's workflow list) and failing with
# startup_failure / no jobs. See DZIENNIK 2026-08-21.

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The tools/ scripts use only stdlib; pytest + FastAPI/httpx
          # (for API server tests) are the only external deps.
          pip install -r requirements-ci.txt

      - name: Run pytest
        run: |
          pytest tests/ -v

      - name: Smoke-test the 9-level harness
        run: |
          # Verify the rewritten test_9_levels.py still reports its 3-state
          # outcome correctly (most levels will be SKIP without API keys;
          # that's expected and not a failure).
          python3 tools/test_9_levels.py 2>&1 | tail -10

      - name: Smoke-test master.csv regen
        run: |
          python3 -c "
          import sys; sys.path.insert(0, 'tools')
          from verify_run import regenerate_master
          ok, count = regenerate_master()
          assert ok, 'regenerate_master() must succeed'
          assert count > 0, 'master.csv must have data rows'
          print(f'master regen OK: {count} rows')
          "

      - name: Smoke-test the API server
        run: |
          # Start the API server, hit /api/datasets, kill it. This catches
          # import-time errors and confirms the FastAPI app boots.
          python3 tools/api_server.py --port 18765 &
          SERVER_PID=$!
          sleep 3
          curl -sf http://127.0.0.1:18765/api/datasets | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          assert 'datasets' in data
          assert data['count'] > 0, 'no datasets found'
          print(f'API OK: {data[\"count\"]} datasets')
          "
          kill $SERVER_PID 2>/dev/null || true
